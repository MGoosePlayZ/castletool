[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castletool"
version = "0.6.0a1"
description = "Interactive Castle deck editor: inject images, animated GIF/WEBP/APNG, video with sound, audio, SVG, MIDI music and vector-rendered fonts (from files or zip/tar archives) into Castle blueprints, set card backgrounds, and upload decks, via a tap/click TUI or a classic CLI."
readme = "README.md"
authors = [
    { name = "MGoosePlayZ" },
]
license = "Unlicense"
license-files = ["LICENSE"]
keywords = [
    "castle", "castle.xyz", "deck", "blueprint", "tui", "cli",
    "gif", "svg", "midi", "font", "video", "image", "audio", "archive",
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.65.0",
    "rich>=13.3.3",
    "Pillow>=9.1.0",
    "mido>=1.2.10",
    "fonttools>=4.0.0",
]

[project.optional-dependencies]
# HEIC/HEIF images. Optional because it can fail to build on some devices
# (e.g. Termux); castletool also tries to install it on first use.
heif = ["pillow-heif>=0.13.0"]

[project.urls]
Homepage = "https://pypi.org/project/castletool/"
Repository = "https://github.com/MGoosePlayZ/castletool"
Issues = "https://github.com/MGoosePlayZ/castletool/issues"

[project.scripts]
castletool = "castletool.tui:main"
castletool-tui = "castletool.tui:main"
castletool-cli = "castletool.castletool:main"
